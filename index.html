<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toot Raft 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--hb:rgba(255,255,255,.85);--hf:#1b2a2f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hb:rgba(20,28,32,.85);--hf:#e8f1f2;color-scheme:dark}}
:root[data-theme="dark"]{--hb:rgba(20,28,32,.85);--hf:#e8f1f2;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3f4;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;justify-content:space-between;align-items:center;pointer-events:none}
.pill{background:var(--hb);color:var(--hf);padding:6px 12px;border-radius:20px;font:600 14px system-ui,sans-serif;border:0;pointer-events:auto}
#pb{font-size:18px;font-variant-numeric:tabular-nums}
#gb{position:fixed;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));width:140px;height:8px;border-radius:4px;background:var(--hb);overflow:hidden}
#gi{height:100%;width:100%;background:#8cc63f}
.btns{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px}
.b{width:26vw;max-width:150px;height:84px;border-radius:42px;border:0;background:#6fbf3a;color:#fff;font:700 18px system-ui,sans-serif;box-shadow:0 4px 0 #3f7a1d;touch-action:none}
.b.f{background:#d98a1e;box-shadow:0 4px 0 #8a560f;width:34vw;max-width:190px}
.b.on{transform:translateY(3px);box-shadow:0 1px 0 #3f7a1d}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#msg div{background:var(--hb);color:var(--hf);padding:18px 26px;border-radius:18px;font:700 20px system-ui,sans-serif}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="pa">Loading…</div><div class="pill" id="pb">00:00.00</div><button class="pill" id="rst">Restart</button></div>
<div id="gb"><div id="gi"></div></div>
<div id="msg"><div id="mt"></div></div>
<div class="btns"><button class="b" id="bL">◀</button><button class="b f" id="bF">💨 TOOT</button><button class="b" id="bR">▶</button></div>
<script>
(function(){if(window.claude)return;
window.claude={use:async n=>{if(n!=='room')return null;
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 let id=null,peers=[],mine={},old={};
 const send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};
 ws.onopen=()=>send({t:'p',p:mine});
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='id')id=m.id;
  else if(m.t==='peers'){const seen={};peers=m.list.map(p=>{const o=old[p.id]||{},pr={};seen[p.id]={};
   for(const k in p.pr){const s=JSON.stringify(p.pr[k]);pr[k]=o[k]&&o[k].s===s?o[k].v:p.pr[k];seen[p.id][k]={s,v:pr[k]}}
   return{peer:p.id,presence:pr,kind:'viewer',isMe:p.id===id,sameTab:p.id===id,updatedAt:0}});old=seen}};
 return{presence(p){Object.assign(mine,p);send({t:'p',p});return Promise.resolve()},peers:()=>peers,connected:()=>ws.readyState===1}}};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=window.THREE,cv=document.getElementById('c');
if(!T){document.getElementById('pa').textContent='3D engine failed to load'}
const ren=new T.WebGLRenderer({canvas:cv,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new T.Scene();scene.background=new T.Color(0x8fd3f4);scene.fog=new T.Fog(0x8fd3f4,70,230);
const cam=new T.PerspectiveCamera(55,1,.1,400);
function rsz(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rsz);rsz();
scene.add(new T.HemisphereLight(0xffffff,0x5a7f95,.95));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(30,60,20);scene.add(dl);
// river
const PTS=[[0,0],[0,-60],[28,-120],[42,-190],[20,-260],[-20,-320],[-30,-390],[0,-450],[40,-500],[50,-570]];
const C=new T.CatmullRomCurve3(PTS.map(p=>new T.Vector3(p[0],0,p[1]))).getSpacedPoints(400);
const HW=11,RR=3.3,NP=C.length;
const NR=C.map((p,i)=>{const a=C[Math.min(i+1,NP-1)],b=C[Math.max(i-1,0)];let tx=a.x-b.x,tz=a.z-b.z;const l=Math.hypot(tx,tz)||1;return{x:-tz/l,z:tx/l}});
const spiky=i=>(i>60&&i<95)||(i>230&&i<290);
function strip(l0,y0,l1,y1,colFn){const pos=[],col=[],idx=[];
 for(let i=0;i<NP;i++){const n=NR[i],p=C[i],c=colFn(i);for(const [l,y] of [[l0,y0],[l1,y1]]){pos.push(p.x+n.x*l,y,p.z+n.z*l);col.push(c.r,c.g,c.b)}
  if(i<NP-1){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
 const m=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide}));scene.add(m)}
const cW=new T.Color(0x20b4f0),cWall=new T.Color(0x6f6b78),cMag=new T.Color(0xd62ad0),cBank=new T.Color(0x8a8690);
strip(-HW,0,HW,0,()=>cW);
for(const s of [1,-1]){strip(s*HW,0,s*HW,3,i=>spiky(i)?cMag:cWall);strip(s*HW,3,s*(HW+60),3,()=>cBank)}
const spk=[];for(let i=0;i<NP;i+=2)if(spiky(i))for(const s of [1,-1])spk.push([C[i].x+NR[i].x*s*(HW-.3),C[i].z+NR[i].z*s*(HW-.3)]);
const sm=new T.InstancedMesh(new T.ConeGeometry(.55,1.8,6),new T.MeshLambertMaterial({color:0xffffff}),spk.length),dm=new T.Object3D();
spk.forEach((p,i)=>{dm.position.set(p[0],3.1,p[1]);dm.updateMatrix();sm.setMatrixAt(i,dm.matrix)});scene.add(sm);
for(const i of [100,200,300]){const g=new T.Mesh(new T.BoxGeometry(HW*2,.1,1),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5}));g.position.set(C[i].x,.05,C[i].z);g.rotation.y=Math.atan2(NR[i].x,NR[i].z)+Math.PI/2;scene.add(g)}
const fin=new T.Mesh(new T.BoxGeometry(HW*2,.1,3),new T.MeshBasicMaterial({color:0xe63946}));fin.position.set(C[395].x,.06,C[395].z);fin.rotation.y=Math.atan2(NR[395].x,NR[395].z)+Math.PI/2;scene.add(fin);
// raft + critters
const raft=new T.Group();
const rimM=new T.MeshLambertMaterial({color:0xf3d9a8});
const base=new T.Mesh(new T.CylinderGeometry(3.2,3.2,.8,32),rimM),disc=new T.Mesh(new T.CylinderGeometry(2.6,2.6,.85,32),new T.MeshLambertMaterial({color:0x9bd33a})),ring=new T.Mesh(new T.TorusGeometry(3,.55,12,32),rimM);
ring.rotation.x=Math.PI/2;ring.position.y=.45;raft.add(base,disc,ring);scene.add(raft);
const COL=[0xf28c28,0x7f8c8d,0x2a9d8f,0xe76f8b],CSS=['#f28c28','#cfd8dc','#4cd0bf','#ff8fb0'];
function critter(col){const g=new T.Group(),m=new T.MeshLambertMaterial({color:col}),k=new T.MeshLambertMaterial({color:0x222222}),w=new T.MeshLambertMaterial({color:0xffffff}),r=new T.MeshLambertMaterial({color:0xd62828}),sp=new T.SphereGeometry(1,14,10);
 const add=(mat,x,y,z,sx,sy,sz)=>{const o=new T.Mesh(sp,mat);o.position.set(x,y,z);o.scale.set(sx,sy,sz);g.add(o)};
 add(m,0,.9,0,.85,1,.8);add(m,0,2.1,0,.7,.65,.65);add(m,-.55,2.7,0,.22,.22,.22);add(m,.55,2.7,0,.22,.22,.22);
 add(w,-.25,2.2,.5,.18,.2,.1);add(w,.25,2.2,.5,.18,.2,.1);add(k,-.25,2.2,.58,.09,.1,.06);add(k,.25,2.2,.58,.09,.1,.06);add(k,0,1.95,.6,.16,.1,.1);
 add(m,-.95,1.3,.3,.28,.28,.28);add(m,.95,1.3,.3,.28,.28,.28);add(r,-.95,1.3,.7,.3,.3,.3);add(r,.95,1.3,.7,.3,.3,.3);g.scale.setScalar(1.25);return g}
function label(txt,col){const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,8,128,48);g.fillStyle=col;g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(txt,64,45);
 const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));s.scale.set(3,1.5,1);s.position.y=4.3;return s}
const CH=[0,1,2,3].map(i=>{const g=critter(COL[i]);g.add(label('P'+(i+1),CSS[i]));scene.add(g);return g});
const PF=[];for(let i=0;i<60;i++){const m=new T.Mesh(new T.SphereGeometry(1,8,6),new T.MeshBasicMaterial({color:i%2?0xb6d93a:0xe5d93a,transparent:true,opacity:.7}));m.visible=false;m.userData={l:0,vx:0,vy:0,vz:0};scene.add(m);PF.push(m)}
let pi=0;
// state
const F=7;let S;
function near(x,z){let bi=0,bd=1e9;for(let i=0;i<NP;i++){const dx=x-C[i].x,dz=z-C[i].z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}return bi}
function fresh(){S={x:C[5].x,z:C[5].z,vx:0,vz:0,t:0,run:0,won:0,cp:0,N:1,g:[1,1,1,1]}}fresh();
function step(dt,fire,ang){
 let fx=0,fz=0;
 for(let i=0;i<S.N;i++){if(fire[i]&&S.g[i]>.02){S.g[i]-=.5*dt;fx-=Math.cos(ang[i])*F;fz-=Math.sin(ang[i])*F;S.run=1}else S.g[i]=Math.min(1,S.g[i]+.35*dt)}
 const i0=near(S.x,S.z),a=C[Math.min(i0+1,NP-1)],b=C[Math.max(i0-1,0)];let tx=a.x-b.x,tz=a.z-b.z;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;
 S.vx+=(fx+tx*1.5)*dt;S.vz+=(fz+tz*1.5)*dt;const dr=1-dt;S.vx*=dr;S.vz*=dr;S.x+=S.vx*dt;S.z+=S.vz*dt;
 const i1=near(S.x,S.z),c=C[i1];let dx=S.x-c.x,dz=S.z-c.z;const d=Math.hypot(dx,dz),lim=HW-RR;
 S.cp=Math.max(S.cp,Math.min(3,Math.floor(i1/100)));
 if(d>lim){if(spiky(i1)){const p=C[S.cp?S.cp*100:5];S.x=p.x;S.z=p.z;S.vx=S.vz=0}
  else{dx/=d;dz/=d;S.x=c.x+dx*lim;S.z=c.z+dz*lim;const vn=S.vx*dx+S.vz*dz;if(vn>0){S.vx-=1.7*vn*dx;S.vz-=1.7*vn*dz}}}
 if(!S.won&&i1>=395)S.won=1;
 if(S.run&&!S.won)S.t+=dt}
// input
const K={},P={L:0,F:0,R:0};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(k==='r')restart();if([' ','arrowleft','arrowright','arrowup'].includes(k))e.preventDefault();wake()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
for(const [id,k] of [['bL','L'],['bF','F'],['bR','R']]){const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{P[k]=1;el.classList.add('on');wake();e.preventDefault()});
 for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>{P[k]=0;el.classList.remove('on')})}
document.getElementById('rst').addEventListener('click',restart);
let ac;function wake(){try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume()}catch(e){}}
function toot(){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(95+Math.random()*40,t);o.frequency.exponentialRampToValueAtTime(45,t+.25);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.3)}catch(e){}}
// room
let room=null,rsN=0,lastF=0,lastA=0,lastAt=0,myA=Math.PI/2,mySlot=-2;const me={j:Date.now()};
(async()=>{try{if(!window.claude||!claude.use)return;const r=await claude.use('room');if(!r)return;room=r;r.presence({g:1,j:me.j,f:0,a:myA,rs:0})}catch(e){room=null}})();
function roster(){if(!room)return[];try{return room.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.g===1&&(!p.isMe||p.sameTab)).sort((a,b)=>(a.presence.j-b.presence.j)||(a.peer<b.peer?-1:1))}catch(e){return[]}}
function restart(){if(room){rsN++;room.presence({rs:rsN}).catch(()=>{})}else fresh()}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(2).padStart(5,'0');
const seenRS={},disp=[Math.PI/2,Math.PI,0,-Math.PI/2],prev=[0,0,0,0];let seenS=null,acc=0,lastPub=0,last=performance.now(),tt=0;
const pa=document.getElementById('pa'),pb=document.getElementById('pb'),gi=document.getElementById('gi'),msg=document.getElementById('msg'),mt=document.getElementById('mt');
const bL=document.getElementById('bL'),bR=document.getElementById('bR');
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
 const R=roster(),meI=R.findIndex(p=>p.sameTab),multi=R.length>1,host=R.length===0||R[0].sameTab;
 const slot=multi?meI:0;if(slot!==mySlot&&slot>=0){mySlot=slot;myA=Math.PI/2+slot*Math.PI/2}
 const dir=((K.a||K.arrowleft||P.L)?1:0)-((K.d||K.arrowright||P.R)?1:0);if(slot>=0&&slot<4)myA+=dir*2.3*dt;
 const fm=!!(K[' ']||K.w||K.arrowup||P.F)&&slot>=0&&slot<4;
 if(room){const pt={};if((fm?1:0)!==lastF){lastF=fm?1:0;pt.f=lastF}if(Math.abs(myA-lastA)>.01&&now-lastAt>33){lastA=myA;lastAt=now;pt.a=+myA.toFixed(3)}if(Object.keys(pt).length)room.presence(pt).catch(()=>{})}
 const NS=multi?Math.min(4,R.length):1,fire=[0,0,0,0],ang=[0,0,0,0];
 for(let i=0;i<NS;i++){if(!multi||R[i].sameTab){fire[i]=fm;ang[i]=myA}else{fire[i]=!!R[i].presence.f;ang[i]=+R[i].presence.a||0}}
 if(host){
  S.N=NS;if(S.t>0)S.run=1;
  for(const p of R){const v=p.presence.rs||0;if(!(p.peer in seenRS))seenRS[p.peer]=v;else if(v>seenRS[p.peer]){seenRS[p.peer]=v;fresh();S.N=NS}}
  acc+=dt;while(acc>=1/60){step(1/60,fire,ang);acc-=1/60}
  if(room&&now-lastPub>50){lastPub=now;const q=(n,d)=>+n.toFixed(d);room.presence({s:[q(S.x,2),q(S.z,2),q(S.vx,2),q(S.vz,2),q(S.t,1),S.cp,S.won,S.N,...S.g.map(v=>q(v,2))]}).catch(()=>{})}
 }else{
  const hs=R[0]&&R[0].presence.s;
  if(hs&&hs!==seenS){seenS=hs;[S.x,S.z,S.vx,S.vz,S.t,S.cp,S.won,S.N]=hs;S.g=hs.slice(8,12)}
  S.x+=S.vx*dt;S.z+=S.vz*dt}
 // visuals
 raft.position.set(S.x,.4+Math.sin(tt*3)*.06,S.z);raft.rotation.set(S.vz*.01,0,-S.vx*.01);
 for(let i=0;i<4;i++){const on=i<S.N;CH[i].visible=on;if(!on)continue;
  disp[i]+=(ang[i]-disp[i])*Math.min(1,dt*14);const a=disp[i],cs=Math.cos(a),sn=Math.sin(a);
  CH[i].position.set(S.x+cs*2.3,.8+Math.abs(Math.sin(tt*4+i))*.05,S.z+sn*2.3);CH[i].rotation.y=Math.atan2(-cs,-sn);
  CH[i].children[CH[i].children.length-1].scale.setScalar(multi&&meI===i?1.5:1);
  const fo=fire[i]&&S.g[i]>.02;
  if(fo){if(!prev[i])toot();const p=PF[pi=(pi+1)%PF.length];p.visible=true;p.position.set(S.x+cs*3.2,1.5,S.z+sn*3.2);p.scale.setScalar(.4);p.material.opacity=.7;p.userData={l:.8,vx:cs*6+S.vx*.3,vy:1.2,vz:sn*6+S.vz*.3}}
  prev[i]=fo?1:0}
 for(const p of PF){if(!p.visible)continue;const u=p.userData;u.l-=dt;if(u.l<=0){p.visible=false;continue}p.position.x+=u.vx*dt;p.position.y+=u.vy*dt;p.position.z+=u.vz*dt;u.vx*=1-2*dt;u.vz*=1-2*dt;p.scale.setScalar(.4+(.8-u.l)*2.2);p.material.opacity=u.l*.9}
 const tp=new T.Vector3(S.x,0,S.z-3);cam.position.lerp(new T.Vector3(S.x,26,S.z+19),Math.min(1,dt*5));cam.lookAt(tp);
 ren.render(scene,cam);
 pa.textContent=multi?`Team ${NS}/4 · you’re ${meI>=0&&meI<4?'P'+(meI+1):'watching'}`:(room?(room.connected&&room.connected()?'Solo · waiting for teammates…':'Not connected to a team yet…'):'Solo · A/D move, Space toot');
 pb.textContent=fmt(S.t);gi.style.width=(Math.max(0,S.g[Math.max(0,Math.min(3,slot))])*100)+'%';
 bL.style.display=bR.style.display=(slot>=0&&slot<4)?'':'none';
 msg.style.display=S.won?'flex':'none';mt.textContent=`🏁 Team finished in ${fmt(S.t)}! Press R to race again`;
 requestAnimationFrame(loop)}
if(T)requestAnimationFrame(loop);
</script></body></html>
